[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "facelock"
version = "0.1.0"
description = "Face encoder training, gallery matching, and live camera recognition"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26.0",
  "opencv-python>=4.8.0,<5",
  "Pillow>=10.0.0",
  "torch>=2.5.0",
  "torchvision>=0.20.0",
  "tqdm>=4.66.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["facelock*"]
